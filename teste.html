<main class="test-shell container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div><span class="small-kicker">Avaliação demonstrativa</span><h3 class="mb-0" id="questionIndex">Questão</h3></div>
    <div class="timer-pill" id="timer">00:00</div>
  </div>
  <div class="progress mb-4"><div class="progress-bar" id="testProgress" style="width:0"></div></div>
  <div class="card-soft test-card">
    <div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Qual opção completa a matriz?</h5><span class="badge-soft" id="questionLevel">Fácil</span></div>
    <div class="matrix-grid mx-auto" id="matrix" style="max-width:560px"></div>
    <hr class="my-4">
    <p class="text-secondary mb-3">Escolha uma alternativa:</p>
    <div class="row g-3" id="options"></div>
    <div class="d-flex justify-content-end mt-4"><button class="btn btn-primary" id="nextBtn" disabled>Próxima questão</button></div>
  </div>
  <div class="notice mt-3">Este protótipo usa questões demonstrativas simples. A lógica definitiva do produto exigirá banco próprio e calibração estatística.</div>
</main>
